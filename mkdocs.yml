      - the-project/installation.md
      - the-project/contributing.md
  - "Webauthn in a nutshell":
      - webauthn-in-a-nutshell/authenticators.md
      - webauthn-in-a-nutshell/ceremonies.md
      - webauthn-in-a-nutshell/user-verification.md
      - webauthn-in-a-nutshell/attestation-and-metadata-statement.md
      - webauthn-in-a-nutshell/extensions.md
  - "Prerequisites":
      - prerequisites/the-relying-party.md
      - prerequisites/credential-source-repository.md
      - prerequisites/user-entity-repository.md
      - prerequisites/javascript.md
  - "Pure PHP":
      - pure-php/webauthn-server.md
      - pure-php/input-loading.md
      - pure-php/input-validation.md
      - pure-php/authenticator-registration.md
      - pure-php/authenticate-your-users.md
      - "Advanced behaviours":
          - pure-php/advanced-behaviours/README.md
          - pure-php/advanced-behaviours/debugging.md
          - pure-php/advanced-behaviours/user-verification.md
          - pure-php/advanced-behaviours/authenticator-selection-criteria.md
          - pure-php/advanced-behaviours/authentication-without-username.md
          - pure-php/advanced-behaviours/authenticator-algorithms.md
          - pure-php/advanced-behaviours/attestation-and-metadata-statement.md
          - pure-php/advanced-behaviours/extensions.md
          - pure-php/advanced-behaviours/authenticator-counter.md
          - pure-php/advanced-behaviours/dealing-with-localhost.md
  - "Symfony bundle":
      - symfony-bundle/the-symfony-way.md
      - symfony-bundle/entities-with-doctrine.md
      - symfony-bundle/entities-with-doctrine-1.md
      - symfony-bundle/firewall.md
      - symfony-bundle/configuration-references.md
      - "Advanced behaviors":
          - symfony-bundle/advanced-behaviors/README.md
          - symfony-bundle/advanced-behaviors/fake-credentials.md
          - symfony-bundle/advanced-behaviors/register-authenticators.md
          - symfony-bundle/advanced-behaviors/debugging.md
          - symfony-bundle/advanced-behaviors/user-verification.md
          - symfony-bundle/advanced-behaviors/attestation-and-metadata-statement.md
          - symfony-bundle/advanced-behaviors/authenticator-selection-criteria.md
          - symfony-bundle/advanced-behaviors/authentication-without-username.md
          - symfony-bundle/advanced-behaviors/extensions.md
          - symfony-bundle/advanced-behaviors/authenticator-counter.md
          - symfony-bundle/advanced-behaviors/dealing-with-localhost.md
  - "Migration":
      - migration/from-v5.x-to-v6.0.md
  - "Symfony UX":
      - symfony-ux/installation.md
      - symfony-ux/integration.md
      - symfony-ux/user-registration.md
      - symfony-ux/additional-authenticators.md
